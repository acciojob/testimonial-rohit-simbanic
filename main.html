<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Testimonial Section</title>
<style>
    body {
        margin: 0;
        font-family: serif;
    }

    .main-container {
        background-color: #f5f5f5;
        padding: 40px 50px;
    }

    .main-container h1 {
        margin-top: 0;
        margin-bottom: 30px;
        font-size: 2em;
    }

    .testimonial {
        background-color: white;
        border: 1px solid #dcdcdc;
        padding: 25px;
        margin-bottom: 25px;
    }

    .text {
        margin: 0 0 30px 0;
    }

    .author {
        text-align: right;
        font-style: italic;
        margin: 0;
    }
</style>
</head>
<body>

    <div class="main-container">
        <h1>Testimonials</h1>
        
        <div class="testimonial">
            <p class="text">This product is amazing! I highly recommend it to anyone in need of a solution like this.</p>
            <p class="author">- John Doe</p>
        </div>

        <div class="testimonial">
            <p class="text">I have been using this for a few weeks now and it has completely transformed my workflow.</p>
            <p class="author">- Jane Smith</p>
        </div>
    </div>

</body>
</html>
